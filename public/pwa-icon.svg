<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente do C: bauxita → ferrugem -->
    <linearGradient id="cGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%"   stop-color="#D4673A"/>
      <stop offset="50%"  stop-color="#C45A2C"/>
      <stop offset="100%" stop-color="#7A2810"/>
    </linearGradient>
    <!-- Gradiente da esfera de ferro: 3D radial -->
    <radialGradient id="sphereGrad" cx="34%" cy="28%" r="66%">
      <stop offset="0%"   stop-color="#9BA4AD"/>
      <stop offset="25%"  stop-color="#636B74"/>
      <stop offset="60%"  stop-color="#3E4248"/>
      <stop offset="100%" stop-color="#191C20"/>
    </radialGradient>
    <!-- Vinheta circular -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Fundo navy sólido — sem alpha -->
  <rect width="512" height="512" fill="#0F2D52"/>

  <!--
    Anel do C
    Centro: 256,256 | Raio externo: 185 | Raio interno: 115
    Abertura: 60° à direita (330° → 30°)

    Pontos:
      Externo 30°:  (416.2, 348.5)
      Externo 330°: (416.2, 163.5)
      Interno 330°: (355.6, 198.5)
      Interno 30°:  (355.6, 313.5)
  -->
  <path d="M 416.2 348.5
           A 185 185 0 1 1 416.2 163.5
           L 355.6 198.5
           A 115 115 0 1 0 355.6 313.5
           Z"
        fill="url(#cGrad)"/>

  <!-- Borda interna do C mais clara (efeito bevel) -->
  <path d="M 408 342
           A 177 177 0 1 1 408 170
           L 398 176
           A 167 167 0 1 0 398 336
           Z"
        fill="#ffffff" fill-opacity="0.07"/>

  <!-- Esfera de ferro -->
  <circle cx="252" cy="258" r="84" fill="url(#sphereGrad)"/>

  <!-- Reflexo da esfera -->
  <ellipse cx="228" cy="226" rx="32" ry="25" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Manchas de ferrugem na esfera -->
  <circle cx="270" cy="277" r="11" fill="#A0431F" fill-opacity="0.28"/>
  <circle cx="253" cy="291" r="6"  fill="#C45A2C" fill-opacity="0.22"/>
  <circle cx="238" cy="268" r="5"  fill="#A0431F" fill-opacity="0.18"/>

  <!-- Vinheta escura nas bordas -->
  <circle cx="256" cy="256" r="240" fill="url(#vignette)"/>

  <!-- Barras douradas no fundo do círculo -->
  <rect x="205" y="434" width="102" height="11" rx="5.5" fill="#E8A317"/>
  <rect x="221" y="451" width="70"  height="11" rx="5.5" fill="#E8A317"/>

  <!-- Badge % — canto superior direito, na abertura do C -->
  <circle cx="387" cy="142" r="31" fill="#E8A317"/>
  <text x="387" y="152"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#0F2D52"
        text-anchor="middle">%</text>
</svg>
