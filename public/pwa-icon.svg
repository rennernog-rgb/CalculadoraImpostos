<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo sólido sem cantos arredondados — iOS faz o clip automaticamente -->
  <rect width="512" height="512" fill="#111118"/>
  <!-- Painel da calculadora -->
  <rect x="96" y="80" width="320" height="352" rx="32" fill="#1c1c28" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.5"/>
  <!-- Display -->
  <rect x="120" y="108" width="272" height="80" rx="14" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Valor no display -->
  <text x="376" y="165" font-family="monospace" font-size="44" fill="#f59e0b" text-anchor="end" font-weight="bold">0,00</text>
  <!-- Botões linha 1 -->
  <rect x="120" y="214" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="204" y="214" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="288" y="214" width="104" height="50" rx="12" fill="#f59e0b" fill-opacity="0.45"/>
  <text x="340" y="248" font-family="sans-serif" font-size="28" fill="#111118" text-anchor="middle" font-weight="bold">÷</text>
  <!-- Botões linha 2 -->
  <rect x="120" y="278" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="204" y="278" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="288" y="278" width="104" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <!-- Botões linha 3 -->
  <rect x="120" y="342" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="204" y="342" width="72" height="50" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
  <rect x="288" y="342" width="104" height="50" rx="12" fill="#f59e0b" fill-opacity="0.45"/>
  <text x="340" y="376" font-family="sans-serif" font-size="28" fill="#111118" text-anchor="middle" font-weight="bold">=</text>
</svg>
