<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo escuro arredondado -->
  <rect width="512" height="512" rx="108" fill="#111118"/>
  <!-- Painel da calculadora -->
  <rect x="112" y="96" width="288" height="320" rx="28" fill="#1c1c28" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Display -->
  <rect x="136" y="120" width="240" height="72" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.35"/>
  <!-- Número no display -->
  <text x="360" y="172" font-family="monospace" font-size="42" fill="#f59e0b" text-anchor="end" font-weight="bold">0,00</text>
  <!-- Grade de botões (3x4) -->
  <!-- Linha 1 -->
  <rect x="136" y="216" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="210" y="216" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="284" y="216" width="92" height="44" rx="10" fill="#f59e0b" fill-opacity="0.35"/>
  <!-- Linha 2 -->
  <rect x="136" y="272" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="210" y="272" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="284" y="272" width="92" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <!-- Linha 3 -->
  <rect x="136" y="328" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="210" y="328" width="60" height="44" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <rect x="284" y="328" width="92" height="44" rx="10" fill="#f59e0b" fill-opacity="0.35"/>
  <!-- Símbolo % no botão destaque -->
  <text x="330" y="246" font-family="sans-serif" font-size="24" fill="#111118" text-anchor="middle" font-weight="bold">÷</text>
  <text x="330" y="358" font-family="sans-serif" font-size="24" fill="#111118" text-anchor="middle" font-weight="bold">=</text>
</svg>
